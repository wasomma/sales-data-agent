[project]
name = "sales-data-agent"
version = "0.7.0"
description = "CLI agent that answers natural-language questions about sales data via text-to-SQL over DuckDB"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "mcp>=1.2",
    "duckdb>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
gemini = ["google-genai>=2.0"]

[project.scripts]
sales = "sales_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_agent = ["static/*"]
